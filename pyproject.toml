[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[project]
name = "megapbx-max"
version = "0.1.0"
description = "Уведомления MegaPBX о пропущенных звонках в чат MAX"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "IndeecDen" }]
keywords = ["megapbx", "max", "chatbot", "telephony", "webhook", "missed-calls"]
dependencies = [
  "fastapi>=0.135,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic>=2.10,<3.0",
  "uvicorn[standard]>=0.41,<1.0",
]

[project.urls]
Repository = "https://github.com/IndeecDen/megapbx-max"
Documentation = "https://github.com/IndeecDen/megapbx-max#readme"
Issues = "https://github.com/IndeecDen/megapbx-max/issues"
Changelog = "https://github.com/IndeecDen/megapbx-max/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2.0",
  "pip-audit>=2.7,<3.0",
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
  "ruff>=0.9,<1.0",
]

[project.scripts]
megapbx-max = "megapbx_max.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/megapbx_max"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "ASYNC"]
